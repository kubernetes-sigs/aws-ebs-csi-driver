name: Renovate Labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize, unlabeled]

permissions:
  pull-requests: write

# Renovate only sets the labels once when the PR opens, but rebases/updates
# cause prow to drop the labels. This job re-applies them.
jobs:
  label:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      (github.event.action != 'unlabeled' ||
       github.event.label.name == 'lgtm' ||
       github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Apply review labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            });
            if (pr.state !== 'open') {
              return;
            }
            const labels = ['lgtm'];
            if (pr.head.ref !== 'renovate/kubernetes-replacements') {
              labels.push('approved');
            }
            const missingLabels = labels.filter(label =>
              !pr.labels.some(current => current.name === label)
            );
            if (missingLabels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: missingLabels
              });
            }
