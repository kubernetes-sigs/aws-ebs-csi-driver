apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/kubernetes/overlays/stable
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ebs-csi-controller
      spec:
        template:
          spec:
            containers:
              - name: ebs-plugin
                env:
                  - name: AWS_SDK_UA_APP_ID
                    value: aws-ebs-csi-driver-e2e-dev
